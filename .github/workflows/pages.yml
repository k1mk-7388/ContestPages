# Deploy the site to GitHub Pages as-is (static HTML; no Jekyll), with a longer deploy timeout.
# GitHub's default "pages build and deployment" gives the file sync 10 minutes, and the ~159 MB
# site occasionally overran it (failed deploys 2026-11-09/10). This allows 30 minutes.
# Lives in analysis/publish/.github so every clean ContestPages commit carries it.
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
